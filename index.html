<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>রবিউল এর অফিস খরচ</title>
<meta name="theme-color" content="#1F4B3F">
<meta name="description" content="রবিউলের প্রতিদিনের অফিস খরচ লেখা ও হিসাব রাখার খাতা">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="অফিস খরচ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EA;
    --paper-deep:#F4EDDB;
    --line:#DDD0AC;
    --ink:#2B2318;
    --ink-soft:#5B5040;
    --green:#1F4B3F;
    --green-deep:#153732;
    --green-soft:#EAF0EC;
    --red:#A6362B;
    --red-soft:#F4E4E0;
    --brass:#C79A44;
    --shadow: 0 10px 30px rgba(31,26,15,0.12);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      repeating-linear-gradient(180deg, transparent, transparent 37px, var(--line) 38px),
      var(--paper);
    color:var(--ink);
    font-family:'Hind Siliguri', sans-serif;
    min-height:100vh;
    padding:24px 14px 60px;
  }
  .wrap{max-width:900px;margin:0 auto;}

  /* Header / cover */
  header{
    background: linear-gradient(155deg, var(--green) 0%, var(--green-deep) 100%);
    color:#F4EEDC;
    border-radius:14px;
    padding:26px 26px 22px;
    box-shadow: var(--shadow);
    position:relative;
    overflow:hidden;
    margin-bottom:22px;
  }
  header::before{
    content:"";
    position:absolute; inset:8px;
    border:1.5px solid rgba(244,238,220,0.35);
    border-radius:8px;
    pointer-events:none;
  }
  header .eyebrow{
    font-size:12.5px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--brass);
    font-weight:600;
    margin-bottom:6px;
  }
  header h1{
    font-family:'Noto Serif Bengali', serif;
    font-size:clamp(26px, 5.2vw, 36px);
    margin:0 0 4px;
    font-weight:700;
  }
  header .sub{
    font-size:14.5px;
    color:#D9CFAF;
  }
  #todayDate{font-weight:600; color:#F4EEDC;}

  /* Stamp badge */
  .stamp{
    position:absolute;
    right:22px; top:20px;
    width:104px; height:104px;
    border:2.5px dashed var(--brass);
    border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(8deg);
    text-align:center;
    line-height:1.15;
  }
  .stamp .lbl{font-size:10px; letter-spacing:1px; color:var(--brass); font-weight:600;}
  .stamp .amt{font-family:'Noto Serif Bengali',serif; font-size:17px; font-weight:700; color:#F4EEDC; margin-top:2px;}
  @media (max-width:560px){ .stamp{display:none;} }

  /* Card */
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow: var(--shadow);
    padding:20px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:'Noto Serif Bengali', serif;
    font-size:18px;
    margin:0 0 14px;
    color:var(--green-deep);
    display:flex; align-items:center; gap:8px;
  }
  .card h2::before{
    content:"";
    width:5px; height:18px;
    background:var(--red);
    border-radius:2px;
    display:inline-block;
  }

  /* Form */
  .form-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:12px;
  }
  .form-grid .full{grid-column:1/-1;}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr 1fr;} }
  .chip-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px;}
  .chip{
    background:var(--paper-deep); border:1px solid var(--line); color:var(--ink-soft);
    font-size:12.5px; padding:5px 13px; border-radius:16px; cursor:pointer;
    font-family:'Hind Siliguri',sans-serif; transition:all .12s ease;
  }
  .chip:hover{background:var(--green-soft); border-color:var(--green); color:var(--green-deep);}
  .chip.active{background:var(--green); border-color:var(--green); color:#fff;}
  .name-badge{
    display:inline-block; background:var(--green-soft); color:var(--green-deep);
    font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:12px; margin-bottom:2px;
  }
  label{font-size:12.5px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:5px;}
  input, select{
    width:100%;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:8px;
    background:#fff;
    font-family:'Hind Siliguri',sans-serif;
    font-size:15px;
    color:var(--ink);
  }
  input:focus, select:focus{outline:2px solid var(--green); outline-offset:1px; border-color:var(--green);}
  .field{margin-bottom:0;}
  .btn{
    border:none; border-radius:8px; padding:10px 18px;
    font-family:'Hind Siliguri',sans-serif; font-weight:600; font-size:14.5px;
    cursor:pointer; transition:transform .12s ease, opacity .12s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--green); color:#F4EEDC;}
  .btn-primary:hover{background:var(--green-deep);}
  .btn-outline{background:transparent; border:1.5px solid var(--green); color:var(--green-deep);}
  .btn-outline.active{background:var(--green); color:#fff;}
  .btn-red{background:var(--red); color:#fff;}
  .btn-ghost{background:var(--paper-deep); color:var(--ink-soft); border:1px solid var(--line);}
  .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .btn-row .btn{flex:1; min-width:130px;}

  /* Toolbar / search */
  .toolbar{
    display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:6px;
  }
  .toolbar .field{flex:1; min-width:160px;}
  .toolbar .btn{white-space:nowrap;}

  .view-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}

  /* Ledger table */
  .ledger-head{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:2.5px solid var(--red);
    padding-bottom:8px; margin-bottom:4px;
  }
  .ledger-head .title{font-family:'Noto Serif Bengali',serif; font-weight:700; color:var(--green-deep); font-size:16px;}
  .ledger-head .total{font-weight:700; color:var(--red); font-size:15.5px;}

  table{width:100%; border-collapse:collapse; margin-top:6px;}
  thead th{
    text-align:left; font-size:12.5px; color:var(--ink-soft);
    padding:8px 10px; border-bottom:1.5px solid var(--line); font-weight:600;
  }
  tbody td{
    padding:11px 10px; font-size:14.5px; border-bottom:1px dashed var(--line);
    vertical-align:top;
  }
  tbody tr:hover{background:var(--paper-deep);}
  td.amt{font-weight:700; color:var(--green-deep); white-space:nowrap;}
  td.date-col{color:var(--ink-soft); white-space:nowrap; border-right:1.5px solid var(--red-soft); font-size:13.5px;}
  td.person-col{color:var(--green-deep); font-weight:600; font-size:13.5px; white-space:nowrap;}
  .del-btn{
    background:none; border:none; cursor:pointer; color:var(--red); font-size:13px;
    padding:4px 8px; border-radius:6px;
  }
  .del-btn:hover{background:var(--red-soft);}
  .empty{
    text-align:center; padding:34px 10px; color:var(--ink-soft); font-size:14.5px;
  }
  .empty .big{font-size:30px; display:block; margin-bottom:8px;}

  .summary-strip{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--green-soft); border:1px solid var(--line);
    border-radius:10px; padding:12px 16px; margin-top:14px;
    font-size:14.5px; color:var(--green-deep); font-weight:600;
  }
  .summary-strip .num{font-family:'Noto Serif Bengali',serif; font-size:18px; color:var(--red);}

  /* Mobile card list (shown instead of table on small screens) */
  .mobile-list{display:none;}
  @media (max-width:600px){
    .desktop-table{display:none;}
    .mobile-list{display:block;}
    .m-row{
      border:1px solid var(--line); border-left:4px solid var(--red);
      border-radius:8px; padding:10px 12px; margin-bottom:10px; background:#fff;
    }
    .m-row .m-top{display:flex; justify-content:space-between; font-size:13px; color:var(--ink-soft);}
    .m-row .m-desc{font-size:15px; font-weight:600; margin:4px 0;}
    .m-row .m-bottom{display:flex; justify-content:space-between; align-items:center;}
    .m-row .m-amt{font-weight:700; color:var(--green-deep); font-family:'Noto Serif Bengali',serif;}
  }

  footer.note{
    text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:18px;
  }

  #installBanner{
    display:none;
    align-items:center; justify-content:space-between; gap:10px;
    background:var(--brass); color:var(--green-deep);
    border-radius:10px; padding:12px 16px; margin-bottom:18px;
    font-size:13.5px; font-weight:600;
  }
  #installBanner button{
    background:var(--green-deep); color:#F4EEDC; border:none; border-radius:7px;
    padding:8px 14px; font-weight:700; font-size:13px; cursor:pointer; white-space:nowrap;
  }

  /* Print styles */
  @media print{
    body{background:#fff; padding:0;}
    header .stamp{display:flex;}
    .card.no-print, .toolbar, .view-tabs, .btn-row, .del-btn, .add-card, .chip-row, #installBanner{display:none !important;}
    .card{box-shadow:none; border:1px solid #999;}
    header{box-shadow:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="installBanner">
    <span>📲 এই টুলটা অ্যাপের মতো ইনস্টল করে নিন</span>
    <button id="installBtn">ইনস্টল করুন</button>
  </div>

  <header>
    <div class="eyebrow">হিসাবের খাতা</div>
    <h1>রবিউল এর অফিস খরচ</h1>
    <div class="sub">আজ, <span id="todayDate"></span></div>
    <div class="stamp">
      <div class="lbl">আজকের খরচ</div>
      <div class="amt" id="stampAmount">৳ ০</div>
    </div>
  </header>

  <div class="card add-card">
    <h2>নতুন খরচ যোগ করুন</h2>
    <div class="form-grid">
      <div class="field full">
        <label for="descInput">বিবরণ</label>
        <input type="text" id="descInput" placeholder="যেমনঃ চা-নাস্তা, প্রিন্টিং, যাতায়াত">
        <div class="chip-row" id="chipRow">
          <button type="button" class="chip" data-val="নাস্তা">নাস্তা</button>
          <button type="button" class="chip" data-val="খাবার">খাবার</button>
          <button type="button" class="chip" data-val="চা/কফি">চা/কফি</button>
          <button type="button" class="chip" data-val="যাতায়াত">যাতায়াত</button>
          <button type="button" class="chip" data-val="প্রিন্টিং">প্রিন্টিং</button>
        </div>
      </div>
      <div class="field">
        <label for="personInput">কে খরচ করলেন</label>
        <input type="text" id="personInput" list="personList" placeholder="যেমনঃ রবিউল">
        <datalist id="personList"></datalist>
      </div>
      <div class="field">
        <label for="amountInput">টাকা (৳)</label>
        <input type="number" id="amountInput" placeholder="০" min="0" step="1">
      </div>
      <div class="field">
        <label for="dateInput">তারিখ</label>
        <input type="date" id="dateInput">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="addBtn" style="flex:2;">➕ খরচ যোগ করুন</button>
    </div>
  </div>

  <div class="card no-print">
    <h2>দেখুন ও খুঁজুন</h2>
    <div class="view-tabs">
      <button class="btn btn-outline active" id="tabToday">📅 আজকের খরচ</button>
      <button class="btn btn-outline" id="tabAll">📖 সব খরচ</button>
    </div>
    <div class="toolbar">
      <div class="field">
        <label for="searchDate">তারিখ দিয়ে খুঁজুন</label>
        <input type="date" id="searchDate">
      </div>
      <button class="btn btn-outline" id="searchBtn">🔍 খুঁজুন</button>
      <button class="btn btn-ghost" id="clearSearchBtn">✕ মুছে ফেলুন</button>
      <div class="field">
        <label for="personFilter">কে করেছেন</label>
        <select id="personFilter">
          <option value="">সবাই</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="ledger-head">
      <div class="title" id="listTitle">আজকের খরচের হিসাব</div>
      <div class="total" id="listTotal">৳ ০</div>
    </div>

    <table class="desktop-table">
      <thead>
        <tr>
          <th style="width:100px;">তারিখ</th>
          <th style="width:100px;">কে</th>
          <th>বিবরণ</th>
          <th style="width:105px;">টাকা</th>
          <th style="width:50px;"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="mobile-list" id="mobileList"></div>

    <div class="empty" id="emptyState" style="display:none;">
      <span class="big">🧾</span>
      কোনো খরচ পাওয়া যায়নি
    </div>

    <div class="summary-strip">
      <span>মোট এন্ট্রি: <span id="entryCount">০</span> টি</span>
      <span>সর্বমোট: <span class="num" id="grandTotal">৳ ০</span></span>
    </div>

    <div class="btn-row no-print">
      <button class="btn btn-outline" id="printBtn">🖨️ প্রিন্ট করুন</button>
    </div>
  </div>

  <footer class="note">রবিউল এর অফিস খরচ · এই ডিভাইসে আপনার তথ্য নিরাপদে সংরক্ষিত থাকে</footer>
</div>

<script>
const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
function toBn(num){
  return String(num).replace(/[0-9]/g, d => bnDigits[d]);
}
function money(n){
  n = Number(n)||0;
  return '৳ ' + toBn(n.toLocaleString('en-IN'));
}
function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const bnMonths = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const bnDays = ['রবিবার','সোমবার','মঙ্গলবার','বুধবার','বৃহস্পতিবার','শুক্রবার','শনিবার'];
function prettyDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  return `${bnDays[d.getDay()]}, ${toBn(d.getDate())} ${bnMonths[d.getMonth()]} ${toBn(d.getFullYear())}`;
}

let expenses = [];
let mode = 'today'; // today | all | search
let searchDateVal = null;
let personFilterVal = '';

const STORAGE_KEY = 'robiul-office-kharoch-v1';

function loadExpenses(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    expenses = raw ? JSON.parse(raw) : [];
  }catch(e){
    expenses = [];
  }
}
function saveExpenses(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(expenses));
  }catch(e){
    alert('সংরক্ষণ করা যায়নি। ব্রাউজারের স্টোরেজ পূর্ণ হতে পারে।');
  }
}

function filteredExpenses(){
  let list;
  if(mode === 'today') list = expenses.filter(e => e.date === todayStr());
  else if(mode === 'search' && searchDateVal) list = expenses.filter(e => e.date === searchDateVal);
  else list = expenses.slice();
  if(personFilterVal) list = list.filter(e => (e.person || 'অজানা') === personFilterVal);
  return list;
}

function updatePersonOptions(){
  const names = Array.from(new Set(expenses.map(e => (e.person||'').trim()).filter(Boolean))).sort();
  const datalist = document.getElementById('personList');
  datalist.innerHTML = names.map(n => `<option value="${escapeHtml(n)}"></option>`).join('');

  const filterSel = document.getElementById('personFilter');
  const prevVal = filterSel.value;
  filterSel.innerHTML = '<option value="">সবাই</option>' +
    names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  if(names.includes(prevVal)) filterSel.value = prevVal;
}

function render(){
  document.getElementById('todayDate').textContent = prettyDate(todayStr());
  updatePersonOptions();

  const todayTotal = expenses.filter(e=>e.date===todayStr()).reduce((s,e)=>s+Number(e.amount),0);
  document.getElementById('stampAmount').textContent = money(todayTotal);

  const list = filteredExpenses().sort((a,b)=> (b.date+b.createdAt).localeCompare(a.date+a.createdAt));
  const total = list.reduce((s,e)=>s+Number(e.amount),0);

  let title = 'আজকের খরচের হিসাব';
  if(mode==='all') title = 'সকল খরচের হিসাব';
  if(mode==='search') title = `${prettyDate(searchDateVal)} তারিখের খরচ`;
  document.getElementById('listTitle').textContent = title;
  document.getElementById('listTotal').textContent = money(total);
  document.getElementById('entryCount').textContent = toBn(list.length);
  document.getElementById('grandTotal').textContent = money(total);

  const tbody = document.getElementById('tableBody');
  const mobileList = document.getElementById('mobileList');
  const emptyState = document.getElementById('emptyState');
  tbody.innerHTML = '';
  mobileList.innerHTML = '';

  if(list.length === 0){
    emptyState.style.display = 'block';
  } else {
    emptyState.style.display = 'none';
    list.forEach(e => {
      const personLabel = (e.person || '').trim() || '—';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="date-col">${prettyDate(e.date)}</td>
        <td class="person-col">${escapeHtml(personLabel)}</td>
        <td>${escapeHtml(e.description)}</td>
        <td class="amt">${money(e.amount)}</td>
        <td><button class="del-btn no-print" data-id="${e.id}">✕ মুছুন</button></td>
      `;
      tbody.appendChild(tr);

      const div = document.createElement('div');
      div.className = 'm-row';
      div.innerHTML = `
        <div class="m-top"><span>${prettyDate(e.date)}</span><button class="del-btn no-print" data-id="${e.id}">✕ মুছুন</button></div>
        <div><span class="name-badge">${escapeHtml(personLabel)}</span></div>
        <div class="m-desc">${escapeHtml(e.description)}</div>
        <div class="m-bottom"><span></span><span class="m-amt">${money(e.amount)}</span></div>
      `;
      mobileList.appendChild(div);
    });
  }

  document.querySelectorAll('.del-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.getAttribute('data-id');
      expenses = expenses.filter(e=>e.id !== id);
      saveExpenses();
      render();
    });
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('dateInput').value = todayStr();

document.getElementById('addBtn').addEventListener('click', ()=>{
  const desc = document.getElementById('descInput').value.trim();
  const person = document.getElementById('personInput').value.trim();
  const amount = document.getElementById('amountInput').value;
  const date = document.getElementById('dateInput').value || todayStr();
  if(!desc || !amount || Number(amount) <= 0){
    alert('অনুগ্রহ করে বিবরণ ও সঠিক টাকার পরিমাণ লিখুন');
    return;
  }
  expenses.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    description: desc,
    person: person,
    amount: Number(amount),
    date: date,
    createdAt: new Date().toISOString()
  });
  saveExpenses();
  document.getElementById('descInput').value = '';
  document.getElementById('amountInput').value = '';
  document.getElementById('dateInput').value = todayStr();
  mode = 'today';
  setActiveTab('tabToday');
  render();
  document.getElementById('descInput').focus();
});

document.getElementById('chipRow').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.getElementById('descInput').value = chip.getAttribute('data-val');
  document.getElementById('descInput').focus();
});

document.getElementById('personFilter').addEventListener('change', ()=>{
  personFilterVal = document.getElementById('personFilter').value;
  render();
});

function setActiveTab(id){
  document.getElementById('tabToday').classList.toggle('active', id==='tabToday');
  document.getElementById('tabAll').classList.toggle('active', id==='tabAll');
}

document.getElementById('tabToday').addEventListener('click', ()=>{
  mode='today'; setActiveTab('tabToday'); render();
});
document.getElementById('tabAll').addEventListener('click', ()=>{
  mode='all'; setActiveTab('tabAll'); render();
});
document.getElementById('searchBtn').addEventListener('click', ()=>{
  const val = document.getElementById('searchDate').value;
  if(!val){ alert('তারিখ নির্বাচন করুন'); return; }
  searchDateVal = val;
  mode = 'search';
  setActiveTab(null);
  render();
});
document.getElementById('clearSearchBtn').addEventListener('click', ()=>{
  document.getElementById('searchDate').value = '';
  mode = 'today';
  setActiveTab('tabToday');
  render();
});
document.getElementById('printBtn').addEventListener('click', ()=>{
  window.print();
});

loadExpenses();
render();

/* PWA install support */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').style.display = 'flex';
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('installBanner').style.display = 'none';
});
window.addEventListener('appinstalled', ()=>{
  document.getElementById('installBanner').style.display = 'none';
});
</script>
</body>
</html>
